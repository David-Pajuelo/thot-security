# =============================================================================
# CONFIGURACIÓN NGINX PARA seguridad.idiaicox.com
# =============================================================================
# Esta configuración sirve tanto CryptoTrace como HPS System
# Dominio: seguridad.idiaicox.com

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name seguridad.idiaicox.com;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name seguridad.idiaicox.com;

    # Resolver para DNS de Docker (permite resolver nombres de contenedores)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SSL Certificate (usar Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/seguridad.idiaicox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seguridad.idiaicox.com/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =============================================================================
    # CRYPTOTRACE - Frontend Next.js
    # =============================================================================
    location /cryptotrace/ {
        proxy_pass http://127.0.0.1:3000/cryptotrace/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Redirigir raíz a /hps/login
    location = / {
        return 301 /hps/login;
    }

    # =============================================================================
    # CRYPTOTRACE - Backend Django API
    # =============================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket support para Django Channels
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =============================================================================
    # CRYPTOTRACE - WebSocket para Django Channels (Agente IA)
    # =============================================================================
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts más largos para WebSocket
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =============================================================================
    # CRYPTOTRACE - Admin Django
    # =============================================================================
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================================================
    # CRYPTOTRACE - Archivos estáticos de Next.js
    # =============================================================================
    location /cryptotrace/_next/ {
        proxy_pass http://127.0.0.1:3000/cryptotrace/_next/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =============================================================================
    # CRYPTOTRACE - Archivos estáticos de Django
    # IMPORTANTE: Esta regla NO debe interceptar /hps/static/ (que va al contenedor)
    # =============================================================================
    # Interceptar /static/ que viene de HPS y servirlo desde el contenedor
    location /static/ {
        # Si el referrer es de /hps/, servir desde el contenedor de HPS
        set $hps_static 0;
        if ($http_referer ~ ^https?://[^/]+/hps/) {
            set $hps_static 1;
        }
        if ($hps_static = 1) {
            proxy_pass http://127.0.0.1:3001/hps/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
            break;
        }
        # Si no, servir archivos estáticos de Django
        alias /var/www/cryptotrace-static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
    
    # Manifest.json - si viene de HPS, servir desde el contenedor
    location = /manifest.json {
        set $hps_manifest 0;
        if ($http_referer ~ ^https?://[^/]+/hps/) {
            set $hps_manifest 1;
        }
        if ($hps_manifest = 1) {
            proxy_pass http://127.0.0.1:3001/hps/manifest.json;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            break;
        }
        # Si no, devolver 404
        return 404;
    }

    # =============================================================================
    # CRYPTOTRACE - Archivos media de Django
    # =============================================================================
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # =============================================================================
    # CRYPTOTRACE - Servicios auxiliares
    # =============================================================================
    location /processing/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /ocr/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /pdf/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # =============================================================================
    # HPS SYSTEM - Frontend React
    # =============================================================================
    # IMPORTANTE: Sin barra final en proxy_pass para mantener el prefijo /hps
    # El contenedor espera recibir las rutas con /hps incluido
    location /hps/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Archivos estáticos de HPS System (JS, CSS, etc.)
    # IMPORTANTE: Esta regla debe ir ANTES de /static/ para tener prioridad
    location /hps/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifest.json de HPS System
    location = /hps/manifest.json {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirigir /hps (sin barra) a /hps/
    location = /hps {
        return 301 /hps/;
    }

    # =============================================================================
    # Health checks
    # =============================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =============================================================================
    # Configuración general
    # =============================================================================
    # Límites de tamaño de archivo
    client_max_body_size 100M;
    
    # Timeouts generales
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

