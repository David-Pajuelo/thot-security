server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Archivos estáticos (JS, CSS, imágenes, manifest.json, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest.json específicamente
    location = /hps/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/json;
    }

    # Archivos estáticos de React (en /hps/static/)
    location /hps/static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Para todas las rutas bajo /hps, servir index.html (SPA routing)
    location /hps {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /hps/index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

