server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Archivos estáticos de React (JS, CSS, imágenes, etc.)
    # Con homepage="/hps", React genera los archivos en /static/ pero las rutas son /hps/static/
    # Necesitamos servir /hps/static/ desde /static/ del filesystem
    location /hps/static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest.json - React lo genera en la raíz pero se accede como /hps/manifest.json
    location = /hps/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/json;
    }

    # Favicon y otros archivos en la raíz
    location ~* ^/hps/(favicon\.ico|logo.*\.png|robots\.txt)$ {
        alias /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Para todas las rutas bajo /hps, servir index.html (SPA routing)
    # IMPORTANTE: Con homepage="/hps", React genera index.html en la raíz del build
    # Cuando se accede a /hps/login, debemos servir index.html directamente
    location /hps/ {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    # Redirigir /hps (sin barra) a /hps/
    location = /hps {
        return 301 /hps/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

