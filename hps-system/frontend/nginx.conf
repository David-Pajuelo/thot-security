server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Archivos estáticos de React (JS, CSS, imágenes, etc.)
    # Estos archivos están en /hps/static/ porque homepage="/hps" en package.json
    location /hps/static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest.json
    location = /hps/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/json;
    }

    # Otros archivos estáticos (favicon, etc.)
    location ~* ^/hps/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Para todas las rutas bajo /hps, servir index.html (SPA routing)
    # IMPORTANTE: Usar root en lugar de alias para que try_files funcione correctamente
    location /hps/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /hps/index.html;
        add_header Cache-Control "no-cache";
    }

    # Redirigir /hps (sin barra) a /hps/
    location = /hps {
        return 301 /hps/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

