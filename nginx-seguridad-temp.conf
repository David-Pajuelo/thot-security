# =============================================================================
# CONFIGURACIÓN NGINX TEMPORAL PARA OBTENER CERTIFICADO SSL
# =============================================================================
# Esta configuración es temporal, solo para que Certbot pueda validar el dominio
# Después se reemplazará con la configuración completa con SSL

# HTTP server (temporal, para validación de Certbot)
server {
    listen 80;
    server_name seguridad.idiaicox.com;

    # Permitir acceso a .well-known para validación de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS (después de obtener el certificado)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

